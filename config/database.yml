# === Database Configuration ===
#
# Development/Test: SQLite (fast, no setup required)
# Production: Supabase PostgreSQL (managed cloud DB)
# Solid Cache/Queue/Cable: Local SQLite in all environments
#
# 프로덕션 환경변수 (실제 값은 fly.toml 의 [env] 와 `fly secrets` 에 있다):
#   SUPABASE_DB_HOST     — aws-1-ap-northeast-2.pooler.supabase.com
#   SUPABASE_DB_USER     — postgres.[project-ref]
#   SUPABASE_DB_PASSWORD — Supabase 프로젝트 DB 비밀번호 (secrets)
#   SUPABASE_DB_PORT     — 6543 (transaction pooler)
#
# HOST/USER 에 기본값을 두지 않는다. 예전에는 폐기된 프로젝트를 가리키는 폴백이
# 있었고, 환경변수가 하나라도 비면 존재하지 않는 곳으로 조용히 접속을 시도했다.
# 지금은 누락된 키 이름을 대며 부팅이 실패한다.

# === SQLite (Development / Test / Solid adapters) ===
sqlite: &sqlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *sqlite
    database: storage/development.sqlite3

test:
  primary:
    <<: *sqlite
    database: storage/test.sqlite3

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV.fetch("SUPABASE_DB_HOST") %>
    port: <%= ENV.fetch("SUPABASE_DB_PORT", 6543) %>
    database: postgres
    username: <%= ENV.fetch("SUPABASE_DB_USER") %>
    password: <%= ENV["SUPABASE_DB_PASSWORD"] %>
    prepared_statements: false
    sslmode: require
  cache:
    <<: *sqlite
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
