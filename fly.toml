# Fly.io 배포 설정
#
# 사전 준비:
#   fly auth login
#   fly apps create kamillee0918-blog
#   fly volumes create blog_storage --size 3 --region nrt
#   fly secrets set RAILS_MASTER_KEY=... SUPABASE_DB_PASSWORD=... TINYMCE_API_KEY=...
#
# 배포:
#   fly deploy

app = "kamillee0918-blog"
primary_region = "nrt"          # 도쿄. `fly platform regions` 로 현재 목록 확인 가능

# 스왑은 요금이 붙지 않는 완충 장치다. shared-cpu-1x 가 기본 제공하는 메모리는 256MB 뿐이고
# 그 위는 전부 "Machines Shared 1x: Additional RAM" 으로 과금된다(2GB 일 때 nrt 기준 월 $10).
# RAM 을 2GB → 1GB 로 내리는 대신 같은 크기의 스왑을 깔아 완충을 남겼다.
# 스왑은 RAM 보다 느리므로, 상시 사용량이 여기까지 닿기 시작하면 memory 를 다시 올릴 것.
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_ENV = "production"
  SOLID_QUEUE_IN_PUMA = "true"

  # Thruster 기본 포트는 80이지만, 컨테이너가 비root(UID 1000)로 실행되므로
  # 특권 포트 바인딩을 피하기 위해 8080으로 올린다. internal_port 와 반드시 일치시킬 것.
  HTTP_PORT = "8080"

  # config/puma.rb 의 기본값은 4다. vCPU 가 1개인 데다, 예전에는 Active Storage 가
  # variant 없는 이미지를 요청받으면 그 웹 요청 안에서 libvips 를 돌렸다. 즉 워커 수가
  # 곧 libvips 동시 실행 수이자 메모리 피크였다.
  # 2026-08-09, 새 표지를 올린 직후 워커 4개가 동시에 variant 를 만들다 여유 메모리
  # (당시 메모리 1GB / 스왑 0 에서 333MB)를 소진해 셋이 60초 하트비트를 놓쳤고,
  # Puma 가 이들을 죽이면서 사이트가 503 이 되었다. 한 요청은 큐에서 470초를 기다린 뒤
  # 502 로 끝났다.
  # 지금은 표지 variant 를 첨부 시점에 미리 굽기 때문에(Post 의 preprocessed 참고)
  # 요청 경로에 libvips 가 없다. 그래도 4로 되돌리지 않는 것은 워커 하나가 곧 Ruby
  # 힙 하나이고, 이 머신의 상시 사용량 대부분이 그 힙이기 때문이다.
  WEB_CONCURRENCY = "2"

  # libvips 는 기본적으로 코어 수만큼 스레드를 띄운다. vCPU 가 1개이므로 이득은 없고
  # 메모리만 더 쓴다.
  VIPS_CONCURRENCY = "1"

  ALLOWED_HOSTS = "www.kamillee0918.blog,kamillee0918.blog,kamillee0918-blog.fly.dev"
  APP_HOST = "kamillee0918.blog"

  # Supabase (비밀번호는 secrets 로 별도 주입)
  SUPABASE_DB_HOST = "aws-1-ap-northeast-2.pooler.supabase.com"
  SUPABASE_DB_PORT = "6543"
  SUPABASE_DB_USER = "postgres.hiiniwcepnzdyvdaqawv"

# Active Storage blob + Solid Cache/Queue/Cable SQLite 가 모두 여기 들어간다.
# 현재 사용량 144MB. 이 볼륨이 이 앱의 유일한 영속 상태다.
[[mounts]]
  source = "blog_storage"
  destination = "/rails/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true

  # 아카이브 가용성이 목표이므로 항상 1대를 켜 둔다.
  # 비용을 더 줄이려면 auto_stop_machines = "suspend" + min_machines_running = 0
  # 으로 바꿀 수 있으나, 첫 요청에서 콜드 스타트가 발생한다.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB → 1GB → 2GB → 1GB. libvips 이미지 변환 때문에 계속 올렸다가, 그 변환을
  # 요청 경로에서 걷어낸 뒤 되돌렸다.
  #
  # 1GB 로 처음 갔을 때 부족했던 이유는 Active Storage 가 variant 를 웹 요청 안에서
  # 만들었기 때문이다. 표지 한 장을 바꾸면 아직 없는 variant 를 방문자가 요청하는 대로
  # 그 자리에서 생성하는데, 유휴 상태에서 이미 605MB 를 쓰고 있어 여유가 333MB 뿐이었고
  # 스왑은 0 이라 완충이 없었다. 2026-08-09 에 이것이 워커 정지 → Puma 60초 타임아웃 →
  # 503 으로 이어졌다(WEB_CONCURRENCY 주석 참고).
  #
  # 그래서 같은 1GB 라도 조건이 다르다. 표지 variant 는 첨부 시점에 미리 굽고, 잡 워커는
  # 스레드 1개이며(config/queue.yml), 스왑 1GB 가 깔려 있다. 2026-09-06 전환 시점의
  # 실측은 유휴 400MB / 여유 560MB 였고, `bin/rails cover:warm` 이 미생성 variant 0개를
  # 보고한 뒤에 내렸다.
  #
  # 되돌려야 하는 신호는 스왑이다. SwapFree 가 눈에 띄게 줄어 있으면 상시 사용량이
  # RAM 을 넘긴 것이므로 memory 를 올릴 것 — 1GB 당 nrt 기준 월 $5.7 쯤 든다.
  #   fly ssh console -a kamillee0918-blog -C "cat /proc/meminfo"
  memory = "1024mb"
