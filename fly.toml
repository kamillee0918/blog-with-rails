# Fly.io 배포 설정
#
# 사전 준비:
#   fly auth login
#   fly apps create kamillee0918-blog
#   fly volumes create blog_storage --size 3 --region nrt
#   fly secrets set RAILS_MASTER_KEY=... SUPABASE_DB_PASSWORD=... TINYMCE_API_KEY=...
#
# 배포:
#   fly deploy

app = "kamillee0918-blog"
primary_region = "nrt"          # 도쿄. `fly platform regions` 로 현재 목록 확인 가능

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_ENV = "production"
  SOLID_QUEUE_IN_PUMA = "true"

  # Thruster 기본 포트는 80이지만, 컨테이너가 비root(UID 1000)로 실행되므로
  # 특권 포트 바인딩을 피하기 위해 8080으로 올린다. internal_port 와 반드시 일치시킬 것.
  HTTP_PORT = "8080"

  # config/puma.rb 의 기본값은 4다. 이 머신은 vCPU 1개 / 메모리 1GB / 스왑 0 이고,
  # Active Storage 는 variant 가 없는 이미지를 요청받으면 그 웹 요청 안에서 libvips 를
  # 돌린다. 즉 워커 수가 곧 libvips 동시 실행 수이자 메모리 피크가 된다.
  # 2026-08-09, 새 표지를 올린 직후 워커 4개가 동시에 variant 를 만들다 여유 메모리
  # (333MB)를 소진해 셋이 60초 하트비트를 놓쳤고, Puma 가 이들을 죽이면서 사이트가
  # 503 이 되었다. 한 요청은 큐에서 470초를 기다린 뒤 502 로 끝났다.
  WEB_CONCURRENCY = "2"

  # libvips 는 기본적으로 코어 수만큼 스레드를 띄운다. vCPU 가 1개이므로 이득은 없고
  # 메모리만 더 쓴다.
  VIPS_CONCURRENCY = "1"

  ALLOWED_HOSTS = "www.kamillee0918.blog,kamillee0918.blog,kamillee0918-blog.fly.dev"
  APP_HOST = "kamillee0918.blog"

  # Supabase (비밀번호는 secrets 로 별도 주입)
  SUPABASE_DB_HOST = "aws-1-ap-northeast-2.pooler.supabase.com"
  SUPABASE_DB_PORT = "6543"
  SUPABASE_DB_USER = "postgres.hiiniwcepnzdyvdaqawv"

# Active Storage blob + Solid Cache/Queue/Cable SQLite 가 모두 여기 들어간다.
# 현재 사용량 144MB. 이 볼륨이 이 앱의 유일한 영속 상태다.
[[mounts]]
  source = "blog_storage"
  destination = "/rails/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true

  # 아카이브 가용성이 목표이므로 항상 1대를 켜 둔다.
  # 비용을 더 줄이려면 auto_stop_machines = "suspend" + min_machines_running = 0
  # 으로 바꿀 수 있으나, 첫 요청에서 콜드 스타트가 발생한다.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB → 1GB → 2GB. libvips 이미지 변환 때문에 계속 올렸다.
  # 1GB 로도 부족했던 이유는 Active Storage 가 variant 를 웹 요청 안에서 만들기 때문이다.
  # 표지 한 장을 바꾸면 아직 없는 variant 를 방문자가 요청하는 대로 그 자리에서 생성하는데,
  # 유휴 상태에서 이미 605MB 를 쓰고 있어 여유가 333MB 뿐이었고 스왑은 0 이라 완충이 없었다.
  # 2026-08-09 에 이것이 워커 정지 → Puma 60초 타임아웃 → 503 으로 이어졌다(WEB_CONCURRENCY 주석 참고).
  memory = "2gb"
